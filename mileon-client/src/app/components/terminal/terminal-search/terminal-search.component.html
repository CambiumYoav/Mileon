<app-search-bar
  [form]="infrastructureSearchForm"
  [showFilters]="false"
  (search)="sendFormValue($event)"
  [submitOnKey]="true"
  [resultData]="resultData"
  [total]="total"
  [searchTextValue]="searchText"
  [showDatePicker]="false"
  [hasResultsDropdown]="hasResultsDropdown"
  [liveSearch]="false" 
  searchBy="שם משתמש,שם מלא,תעודת זהות..."
  searchTitle="חיפוש"
  [showPlaceholder]="true"
  [searchBy]="searchByText"
></app-search-bar>
