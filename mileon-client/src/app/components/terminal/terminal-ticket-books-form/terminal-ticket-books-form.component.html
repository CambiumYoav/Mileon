<div class="infrastructure-container p-4">
  <div class="inline-header">
    <h5 class="title">{{ title }}</h5>
    <img class="exit-icon" [src]="Icons.EXIT" (click)="onNoClick()" />
    
  </div>
  <!-- Form -->
  <form [formGroup]="dynamicForm" (ngSubmit)="onSubmit()">
    <div class="form-container">
      <!-- Loop through rows -->
      @for (row of rows; track $index) {
        <div class="form-row">
          <!-- Loop through fields within a row -->
          @for (field of row.row; track field.name) {
            <div
              [class]="'form-field' + field.size"
              [ngClass]="{
            disabled: !!field.disabled,
            inputError: 
              (field.type === 'fromTo' && (
                dynamicForm.get(field.name + '.from')?.invalid && (dynamicForm.get(field.name + '.from')?.touched || isSubmitted) ||
                dynamicForm.get(field.name + '.to')?.invalid && (dynamicForm.get(field.name + '.to')?.touched || isSubmitted)
              )) ||
              (field.type !== 'fromTo' && (
                dynamicForm.get(field.name)?.invalid &&
                dynamicForm.get(field.name)?.touched &&
                !!dynamicForm.get(field.name)?.errors
              )) ||
              (isSubmitted && dynamicForm.get(field.name)?.errors?.['required'])
          }"
            >
              <!-- Field Content -->
              @if (!field.hide) {
                <!-- Field Types -->
                @switch (field.type) {
                  @case ('text') {
                    <!-- Text Input -->
                    <app-input-text
                      [formControlName]="field.name"
                      [title]="field.label"
                      [isRequired]="field.isRequired"
                      [placeholder]="field.placeholder || ''"
                      [isValid]="!(dynamicForm.get(field.name)?.invalid && (dynamicForm.get(field.name)?.touched || isSubmitted))"
                      [errorMessage]="getFieldErrorMessage(field.name)"
                    />
                  }
                  @case ('number') {
                    <!-- Number Input -->
                    <app-input-text
                      [formControlName]="field.name"
                      [title]="field.label"
                      [isRequired]="field.isRequired"
                      [placeholder]="field.placeholder || ''"
                      [isValid]="!(dynamicForm.get(field.name)?.invalid && (dynamicForm.get(field.name)?.touched || isSubmitted))"
                      [errorMessage]="getFieldErrorMessage(field.name)"
                      type="number"
                    />
                  }
                  @case ('date') {
                    <!-- Date Input -->
                    <app-input-date
                      [formControlName]="field.name"
                      [title]="field.label"
                      [isValid]="!(dynamicForm.get(field.name)?.invalid && (dynamicForm.get(field.name)?.touched || isSubmitted))"
                    />
                  }
                  @case ('select') {
                    <!-- Select Dropdown -->
                    <app-select
                      [formControlName]="field.name"
                      [title]="field.label"
                      [isRequired]="field.isRequired"
                      [placeholder]="field.placeholder || field.label"
                      [options]="field.options || []"
                      [bindValueKey]="'value'"
                      [bindLabelKey]="'display'"
                      [isValid]="!(dynamicForm.get(field.name)?.invalid && (dynamicForm.get(field.name)?.touched || isSubmitted))"
                      [displaySearch]="false"
                    />
                  }
                  @case ('selectWithLookup') {
                    <app-select
                      [formControlName]="field.name"
                      [title]="field.label"
                      [isRequired]="field.isRequired"
                      [placeholder]="field.placeholder || field.label"
                      [bindLabelKeys]="field.bindLabelKeys"
                      [dataFunction]="field.dataFunction"
                      [searchPlaceholder]="'חיפוש'"
                      [bindLabelKey]="'value'"
                      [bindValueKey]="'id'"
                      [isMultiSelect]="field.isMultiSelect || false"
                      [isValid]="!(dynamicForm.get(field.name)?.invalid && (dynamicForm.get(field.name)?.touched || isSubmitted))"
                      [displaySearch]="true"
                    />
                  }
                }
              }
            </div>
          }
        </div>
      }
    </div>
 
    <!-- Buttons -->
    <div class="button-container">
      <app-button
        [buttonText]="isTransfer ? 'העבר לפקח' : 'שמור שינויים'"
        (clickFunction)="onSubmit()"
        [buttonClass]="'primary-btn btn-fill '"
      ></app-button>
    </div>
  </form>
</div>
