<div class="infrastructure-container p-4">
  <div class="inline-header">
    <img class="exit-icon" [src]="Icons.EXIT" (click)="onNoClick()" />
    <h5 class="title">{{ title() }}</h5>
  </div>
  <!-- Form -->
  <form [formGroup]="dynamicForm" (ngSubmit)="onSubmit()">
    <div class="form-container">
      <!-- Loop through rows -->
      @for (row of rows(); track $index) {
        <div class="form-row">
          @for (field of row.row; track field.name) {
            <div
              [class]="'form-field' + field.size"
              [ngClass]="{
                disabled: !!field.disabled,
                inputError: 
                  (isSubmitted() && dynamicForm.get(field.name)?.errors?.['required'])
              }"
              [style.display]="field.hide ? 'none' : null"
            >
              <!-- Field Content -->
              @if (!field.hide) {
                <!-- Field Label -->
                <label class="title-placeholder" [for]="field.name">
                  @if (field.isRequired) {
                    <img
                      class="required-icon"
                      [src]="Icons.ASTERISK_RED"
                    />
                  }
                  {{ field.label }}
                </label>

                <!-- Field Types -->
                @switch (field.type) {
                  @case ('file') {
                    <app-file-upload-new
                      class="upload-file"
                      (fileSelected)="getUploadedFile($event)"
                      [maxFileSizeMB]="14"
                      [selectedFiles]="filesToUpload()"
                      [isDownoladable]="true"
                      [allowedFileTypes]="[FileType.PDF]"
                    ></app-file-upload-new>
                  }
                }
              }
            </div>
          }
        </div>
      }
    </div>
  </form>

  <div
    class="mt-3"
    [ngClass]="{
      'button-container': true
    }"
  >
    <app-button
      [buttonText]="'שמור '"
      (clickFunction)="onSubmit()"
    ></app-button>
  </div>
</div>
