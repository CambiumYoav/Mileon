<div [class.disabled]="disabled">
  <div class="inline-header">
    <img *ngIf="isRequired" class="exit-icon" [src]="Icons.ASTERISK_RED" />
    <div
      class="title-placeholder"
      [ngStyle]="{ 'margin-bottom': title ? '0.5rem' : '0' }"
    >
      {{ title }}
    </div>
  </div>
  <div
    [class.input-fill]="appearance != 'standard'"
    [class.search-active]="isSearchVisible"
    [class.multiselect]="isMultiSelect"
    class="select"
    [ngClass]="{
      invalidInput: !isValid,
      validInput: control?.value && control?.touched
    }"
  >
    <span *ngIf="control?.value && (isMultiSelect ? control.value.length : true)">
      <mat-icon class="ml-2" (click)="clearSelectionAndUpdateDateAccordingly()">clear</mat-icon>
    </span>
    
    <!-- Custom dropdown arrow icon -->
    <img 
      class="custom-dropdown-arrow" 
      [src]="Icons.ARROW_DOWN" 
      alt="dropdown arrow"
    />
    
    <!-- Search input overlay - only shown when displaySearch is true -->
    <div class="search-overlay" *ngIf="displaySearch && isSearchVisible">
      <img 
        class="search-icon" 
        [src]="Icons.SEARCH" 
        alt="search icon"
      />
      <input
        matInput
        class="search-input-overlay"
        [placeholder]="searchPlaceholder"
        [formControl]="filterFormControl"
        (focus)="onSearchFocus()"
        (blur)="onSearchBlur()"
        (keydown.escape)="hideSearch()"
        (keydown.enter)="hideSearch()"
      />
      <mat-icon class="search-close-icon" (click)="hideSearch()">close</mat-icon>
    </div>
    
    <mat-select
      appInfiniteScroll
      (scrolled)="updateCurrentPage()"
      [formControl]="control"
      disableOptionCentering
      [multiple]="isMultiSelect"
      [placeholder]="placeholder"
      [compareWith]="compareValues"
      (openedChange)="onSelectOpened($event)"
      [panelClass]="isMultiSelect ? 'mat-mdc-select-panel multiselect-panel' : 'mat-mdc-select-panel'"
      [attr.data-multiselect]="isMultiSelect"
    >
      <div *ngIf="items$ | async as retrievedItems; else waitingResponse">
        <mat-option
          *ngFor="let item of retrievedItems"
          [value]="item[bindValueKey]"
        >
          <ng-container *ngIf="bindLabelKeys; else elseBlock">
            <span 
              appTruncatedTextTooltip 
            >{{ constructLabel(item, bindLabelKeys) }}</span>
          </ng-container>
          <ng-template #elseBlock>
            <span 
              appTruncatedTextTooltip 
            >{{ item[bindLabelKey] || item.name || item.section }}</span>
          </ng-template>
        </mat-option>
      </div>

      <ng-template #waitingResponse>
        <mat-option disabled="true">טוען...</mat-option>
      </ng-template>
    </mat-select>
  </div>
  
  <!-- Selected items display section -->
  <div class="selected-items-container" *ngIf="isMultiSelect && control?.value && control.value.length > 0">
    <div class="selected-item-tag" *ngFor="let selectedValue of control.value; let i = index">
      <span 
        class="tag-text" 
        appTruncatedTextTooltip 
      >{{ getSelectedItemLabel(selectedValue) }}</span>
      <mat-icon class="remove-icon" (click)="removeSelectedItem(i, $event)">close</mat-icon>
    </div>
  </div>
</div>
