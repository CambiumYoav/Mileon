<div
  [class]="
    className
      ? className + ' align-items-center d-flex gap-2'
      : 'checkbox align-items-center d-flex gap-2'
  "
>
  <input
    type="checkbox"
    class="checkbox-primary checkbox-sm"
    [formControl]="control"
  />
  <span class="title">{{ placeholder }}</span>
</div>
