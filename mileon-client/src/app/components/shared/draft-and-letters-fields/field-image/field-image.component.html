<div class="field-box" [ngClass]="field.size">
  <div class="field-inner-box" [ngClass]="field.size">
    <!-- Title only when not selecting and not selected -->
    @if (!isSelecting() && !selectedValue()) {
      <div class="field-text">
        תבנית תמונה
      </div>
    }

    <!-- Default button to start selection -->
    @if (!isSelecting() && !selectedValue()) {
      <app-button
        [buttonClass]="'secondary-btn outline-btn'"
        [buttonText]="'לחץ על הכפתור כדי לבחור תבנית תמונה'"
        (click)="startSelecting()"
      ></app-button>
    }

    <!-- Dropdown top-right, Button bottom-left -->
    @if (isSelecting()) {
      <div class="template-selection-container">
        <div class="dropdown-top-right" [formGroup]="form">
          <app-select
            fxFill
            appearance="fill"
            [bindLabelKeys]="field.bindLabelKeys"
            [formControlName]="field.name"
            [dataFunction]="field.dataFunction"
            searchPlaceholder="חיפוש"
            bindLabelKey="value"
            bindValueKey="id"
            [isMultiSelect]="false"
            [placeholder]="'בחירת תבנית תמונה'"
          ></app-select>
        </div>

        <div class="save-bottom-left">
          <app-button
            [buttonClass]="'primary-btn'"
            [buttonText]="'שמור'"
            (click)="saveSelection()"
          ></app-button>
        </div>
      </div>
    }

    <!-- After save: show selected value and change button -->
    @if (selectedValue() && !isSelecting()) {
      <div class="template-selected">
        <app-selected-template-field
          [buttonText]="selectedValue()"
          (click)="startSelecting()"
          [isImg]="true"
        >
        </app-selected-template-field>
      </div>
    }
  </div>
</div>
