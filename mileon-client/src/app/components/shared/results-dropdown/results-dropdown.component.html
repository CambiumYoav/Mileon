<div class="results-container" dir="rtl">
  <ul class="results-list">
    @for (item of uniqueOptions(); track item.displayValue; let i = $index) {
      <li class="result-item" (click)="goToDetails(item)">
        <span class="option-text">{{ item.displayValue }}</span>
      </li>
    }
  </ul>
</div>
