<div class="actions">
  <div class="wrap-btns">
    <div class="btns">
      <div class="constant-btns">
        @for (button of allowedButtons(); track button.text) { @if
        (!button.disabled) {
        <app-button
          [buttonText]="button.text"
          [imgSrc]="button.imgSrc"
          (click)="button.disabled ? null : performAction(button.text)"
          [tooltipText]="button.tooltipText"
          [tooltipClass]="button.tooltipClass"
          [isDisabled]="
            button.isDisabled || (!button.alwaysEnabled && disableUntilSet)
          "
        >
        </app-button>
        } }
      </div>
    </div>
    <span class="error">{{ errorContent }}</span>
  </div>
</div>
