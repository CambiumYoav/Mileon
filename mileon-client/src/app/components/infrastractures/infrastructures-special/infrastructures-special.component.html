<div class="container-lg p-4">
  <div class="row pb-4 align-items-center position-relative">
    <div class="col d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center col-5">
        <div class="arrow-container" (click)="back()">
          <img [src]="Icons.ARROW_LEFT" />
        </div>
        <span class="heading">{{ title() }}</span>
      </div>
    </div>
  </div>
  <div class="row pb-4">
    <div class="header col">
      <app-infrastructures-search
        (onSearch)="triggerSearch($event)"
        [searchData]="searchData()"
        [resultData]="list()"
        [total]="total()"
        [searchByText]="SearchByTextEnum.SpecialSearch"
      ></app-infrastructures-search>
    </div>
    <div class="d-flex justify-content-between mt-3">
      <div class="d-flex">
        <form [formGroup]="form">
          <div class="d-flex flex-row gap-3">
            <app-select
              [title]="'סוג'"
              [placeholder]="'בחר סוג'"
              [options]="types"
              [bindValueKey]="'value'"
              [bindLabelKey]="'display'"
              [formControlName]="'type'"
              [isRequired]="false"
              [displaySearch]="false"
            ></app-select>
            <app-input-date
              [formControlName]="'lastUpdate'"
              [title]="'תאריך קליטה אחרון'"
              [placeholder]="'dd-mm-yyyy'"
            ></app-input-date>
          </div>
        </form>
      </div>
      <div class="constant-btns">
        <app-button
          [buttonText]="'לוג שינויים'"
          [imgSrc]="Icons.DOWNLOAD_REPORTS"
        >
        </app-button>
        <app-button
          [buttonText]="'יצוא לאקסל'"
          (clickFunction)="openDialogExport()"
          [imgSrc]="Icons.EXCEL_UP"
          [isDisabled]="!totalRecords()"
        >
        </app-button>
        <app-button
          [buttonText]="'יבוא מאקסל'"
          (clickFunction)="openDialogImport()"
          [imgSrc]="Icons.EXCEL_DOWN"
          [isDisabled]="isImportDisabled()"
        >
        </app-button>
      </div>
    </div>
  </div>
  @if (!isSelected()) {
    <app-infrastructures-table
      [columns]="columns()"
      [data]="data()"
      [total]="total()"
      [count]="count()"
      (onFormChanges)="triggerSearch($event)"
      [form]="infrastructureForm"
      [loader]="loader()"
    ></app-infrastructures-table>
  }
  @if (isDisabled()) {
    <app-infrastructures-disabled
      (disabledType)="setType($event)"
      (totalDisabled)="getTotalRecords($event)"
      [searchData]="searchData() || undefined"
      [searchText]="searchText()"
      [infrastructureForm]="infrastructureForm"
      [isImported]="isImported()"
      [dateValue]="dateValue()"
    ></app-infrastructures-disabled>
  }

  @if (isPublic()) {
    <app-infrastructures-public
      (publicType)="setType($event)"
      (totalPublic)="getTotalRecords($event)"
      [searchData]="searchData() || undefined"
      [searchText]="searchText()"
      [isImported]="isImported()"
      [dateValue]="dateValue()"
    ></app-infrastructures-public>
  }
</div>
