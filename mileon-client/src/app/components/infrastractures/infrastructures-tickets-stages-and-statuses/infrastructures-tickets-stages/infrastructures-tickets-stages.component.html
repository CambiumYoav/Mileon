<div class="container-lg p-4">
  <div class="row pb-4 align-items-center">
    <div class="col d-flex justify-content-between align-items-center">
      <!-- Title -->
      <span class="heading">{{ title() }}</span>

      <!-- Button -->
      <app-button
        [buttonText]="'יצוא לאקסל'"
        (clickFunction)="openDialogExport()"
        [imgSrc]="Icons.EXCEL_UP"
        [isDisabled]="!total()"
      >
      </app-button>
    </div>
  </div>
  <div class="">
    <app-infrastructures-table
      [columns]="columns()"
      [data]="data()"
      [total]="total()"
      [count]="count()"
      (onFormChanges)="loadData($event)"
      [form]="infrastructureForm"
      [loader]="loader()"
    ></app-infrastructures-table>
  </div>
</div>
