<div class="container-lg p-4">
  <div class="row pb-4 align-items-center position-relative">
    <div class="col d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center col-5">
        <div class="arrow-container" (click)="back()">
          <img [src]="Icons.ARROW_LEFT" />
        </div>
        <span class="heading">{{ title() }}</span>
      </div>
    </div>
  </div>
  <div class="row pb-4" > 
    <div class="header col">
      <app-infrastructures-search
        (onSearch)="loadData($event)"
        [searchData]="searchData()"
        [resultData]="list()"
        [total]="total()"
        [searchByText]="SearchByTextEnum.TicketsSourceSearch"
      ></app-infrastructures-search>
    </div>
    <div class="d-flex justify-content-between mt-3">
      <div class="d-flex">
        <div class="d-flex flex-column">
          <form [formGroup]="infrastructureForm()">
            <app-select
              formControlName="authority"
              [title]="'שם רשות'"
              [placeholder]="'רשות'"
              [options]="authorities()"
              [bindValueKey]="'id'"
              [bindLabelKey]="'value'"
              [displaySearch]="true"
              [isRequired]="true"
              (ngModelChange)="onAuthorityChange($event)"
            ></app-select>
          </form>
        </div>
      </div>
      <div class="constant-btns">
        <app-button [buttonText]="'לוג שינויים'"> </app-button>
        <app-button
          [buttonText]="'יצוא לאקסל'"
          (clickFunction)="openDialogExport()"
          [imgSrc]="Icons.EXCEL_UP"
          [isDisabled]="!total()"
        >
        </app-button>
      </div>
    </div>
  </div>

  <app-infrastructures-tickets-source-table
    [columns]="columns()"
    [data]="data()"
    [total]="total()"
    [count]="count()"
    (onFormChanges)="loadData($event)"
    (onRowEvent)="openEdit($event)"
    [form]="infrastructureForm()"
    [showPaginator]="true"
    [loader]="loader()"
  >
  </app-infrastructures-tickets-source-table>
</div>
