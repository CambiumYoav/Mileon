<div class="container-lg p-4">
  <div class="row pb-4 align-items-center position-relative">
    <div class="col d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center col-5">
        <span class="heading">{{ title() }}</span>
      </div>
    </div>
  </div>
  <div class="row pb-4">
    <app-users-permissions-management-search
      (onSearch)="loadData($event)"
      [searchData]="searchData()"
      [resultData]="list()"
      [total]="total()"
    ></app-users-permissions-management-search>

    <div class="header col">
      <div class="constant-btns d-flex align-items-center mb-2">
        <app-button
          [buttonText]="'הוסף עובד'"
          (clickFunction)="openDialogForm()"
        >
        </app-button>
      </div>
    </div>
    
    <app-users-permissions-management-table
      [data]="data()"
      [total]="total()"
      [count]="count()"
      (onFormChanges)="loadData($event)"
      (onRowClick)="onEditClick($event)"
      tableColumns="UserPremissionsManagmentColumns"
      [loader]="loader()"
      [pageSize]="100"
    ></app-users-permissions-management-table>
  </div>
</div>
