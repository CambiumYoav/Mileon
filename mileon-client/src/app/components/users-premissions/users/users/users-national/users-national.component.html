<div class="container-lg p-4">
  <div class="row pb-4 align-items-center position-relative">
    <div class="col d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center col-5">
        <span class="heading">{{ title }}</span>
      </div>
    </div>
  </div>
  <div class="d-flex align-items-center mb-1">
    <app-checkbox
      (valueChanged)="onCheckboxSelectAllChange($event)"
      [label]="'בחר את כל המשתמשים '"
    ></app-checkbox>
  </div>
  <div class="row pb-4">
    <app-users-search
      (onSearch)="loadData($event)"
      [searchData]="searchData"
      [resultData]="list"
      [total]="total()"
    ></app-users-search>

    <div class="header col d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center">
        <app-checkbox
          (valueChanged)="onCheckboxChange($event)"
          [label]="'הצג משתמשים לא פעילים '"
        ></app-checkbox>
      </div>
      <div class="constant-btns d-flex align-items-center">
        <app-button
          [buttonText]="'יצוא לאקסל'"
          [imgSrc]="Icons.EXCEL_UP"
          (clickFunction)="openDialogExport()"
        ></app-button>
        <app-button
          [buttonText]="'משתמש חדש'"
          (clickFunction)="redirectToCreateUser()"
        >
        </app-button>
      </div>
    </div>
  </div>

<app-users-table
  [data]="data()"
  [total]="total()"
  [count]="count()"
  (onFormChanges)="loadData($event)"
  tableColumns="UsersMainColumns"
  [loader]="loader()"
  [isChecked]="selectAll()"
></app-users-table>
</div>
