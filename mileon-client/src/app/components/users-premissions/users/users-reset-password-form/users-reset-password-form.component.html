<div class="users-container p-4">
  <!-- Exit Icon -->
  <div class="inline-header">
    <img class="exit-icon" [src]="Icons.EXIT" (click)="onNoClick()" />
    <h5 class="form-title">{{ title() }}</h5>
  </div>

  <!-- Form -->
  <form class="form" [formGroup]="dynamicForm" (ngSubmit)="onSubmit()">
    <div class="form-container">
      <!-- Loop through fields -->
      @for (field of fields(); track field.name) {
        <div
          class="form-field"
          [class]="field.size"
          [ngClass]="{
              disabled: !!field.disabled,
              inputError:
                (dynamicForm.get(field.name)?.invalid &&
                  dynamicForm.get(field.name)?.touched &&
                  !!dynamicForm.get(field.name)?.errors) ||
                (isSubmitted() && dynamicForm.get(field.name)?.errors?.['required'])
            }"
        >
          <!-- Field Label -->
          <label class="title-placeholder" [for]="field.name">
            @if (field.isRequired) {
              <img
                class="required-icon"
                [src]="Icons.ASTERISK_RED"
              />
            }
            {{ field.label }}
          </label>

          <!-- Field Types -->
          <ng-container [ngSwitch]="field.type">
            <!-- Text Input -->
            <app-input-text
              *ngSwitchCase="'text'"
              [id]="field.name"
              [formControlName]="field.name"
              [placeholder]="field.placeholder || field.label"
            />
          </ng-container>
        </div>
      }
      <!-- <div>
        <button class="mt-2 link-button" (click)="onLinkClick()">
          לא זוכר את הסיסמה?
        </button>
      </div> -->
    </div>

    <div class="password-container">
      <div class="password-title">על הסיסמה להיות:</div>
      <div class="password">הסיסמה לא תקטן מ8 תווים ולא תגדל מ16</div>
      <div class="password">שימוש בלפחות אות גדולה אחת (A-Z)</div>
      <div class="password">שימוש בלפחות אות קטנה אחת (a-z)</div>
      <div class="password">שימוש בלפחות ספרה אחת (0-9)</div>
      <div class="password">
        שימוש בתו מיוחד אחד (!, &#64;, #, $, %, ^, &, *)
      </div>
    </div>

    <!-- Buttons -->
    <div class="button-container">
      <app-button
        [buttonText]="'ביטול'"
        (clickFunction)="onNoClick()"
        [buttonClass]="'outline-btn'"
      ></app-button>
      <app-button
        [buttonText]="'אפס'"
        (clickFunction)="onSubmit()"
        [buttonClass]="'primary-btn'"
      ></app-button>
    </div>
  </form>
</div>
