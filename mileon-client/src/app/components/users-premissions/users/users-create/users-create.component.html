<div class="container-lg p-4">
  <div class="row pb-4 align-items-center position-relative">
    <div class="col d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center col-5">
        <span class="heading">{{ title() }}</span>
      </div>
    </div>
  </div>
  <app-button
  [imgSrc]="Icons.RIGHT_ARROW"
  [buttonText]="'חזור'"
  (clickFunction)="back()"
  [buttonClass]="'outline-secondary-btn'"
>
</app-button>
  
  @if (isMviewAuthority()) {
    <app-users-create-national></app-users-create-national>
  }

  @if (!isMviewAuthority()) {
    <app-users-create-local
      [userForm]="userForm"
      [currentAuthority]="currentAuthority()"
    ></app-users-create-local>
  }
</div>
