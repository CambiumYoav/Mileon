@if (hasTabs()) {
  <div class="pt-3">
    <app-tabs-group
      [tabs]="tabs()"
      (action)="changeTab($event)"
      [currentActive]="currentActive()"
    ></app-tabs-group>
  </div>
} @else {
  <div class="pt-3">
    <div class="no-tabs-message">
      <p>אין טאבים זמינים</p>
    </div>
  </div>
}
