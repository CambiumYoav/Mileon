@if (permissionsSearchForm()) {
  <app-search-bar
    [form]="permissionsSearchForm()"
    [showFilters]="false"
    (search)="sendFormValue($event)"
    [submitOnKey]="true"
    [resultData]="resultData()"
    [total]="total()"
    [searchTextValue]="searchText()"
    [showDatePicker]="false"
    [hasResultsDropdown]="hasResultsDropdown()"
    [liveSearch]="false"  
    [searchBy]="searchPlaceholder()"
    [searchTitle]="searchTitle()"
    [showPlaceholder]="true"
  ></app-search-bar>
}
