<div class="container-lg p-4">
  <div class="row pb-4 align-items-center position-relative">
    <div class="col d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center col-5">
        <span class="heading">{{ title }}</span>
      </div>
    </div>
  </div>

  <div class="row pb-4 gap-3">
    <app-authority-management-search
      (onSearch)="loadData($event)"
      [searchData]="searchData()"
      [resultData]="data()"
      [total]="total()"
    ></app-authority-management-search>

    <div class="header col">
      <div class="header col d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <app-checkbox
            [label]="'הצג לא פעילים '"
            (valueChanged)="onCheckboxChange($event)"
          ></app-checkbox>
        </div>
        <div class="constant-btns d-flex align-items-center">
          <!-- <app-button [buttonText]="'לוג שינויים '"></app-button> -->
          <app-button
            [buttonText]="'  הפוך לפעיל/לא פעיל'"
            (clickFunction)="openIsActiveModal()"
            [isDisabled]="!isDraftAndLetterSelected()"
          ></app-button>
          <app-button
            [buttonText]="' גלופה חדשה'"
            (clickFunction)="navigateToCreateDraft()"
          ></app-button>

          <app-button
            [buttonText]="'מכתב חדש'"
            (clickFunction)="navigateToCreateLetter()"
          >
          </app-button>
          <app-button
            [buttonText]="'יצוא לאקסל'"
            [imgSrc]="Icons.EXCEL_UP"
            (clickFunction)="openExportModal()"
          ></app-button>
        </div>
      </div>
    </div>
  </div>
  <!-- add button for cahnge is active -->

  <app-authority-management-table
    [data]="data()"
    [total]="total()"
    [count]="count()"
    (onFormChanges)="loadData($event)"
    [selectedAuthorityData]="selectedDraftAndLetterData$"
    tableColumns="DraftsAndLettersColumns"
    [loader]="loader()"
    [showPaginator]="true"
    (onRowClick)="onRowClick($event)"
    (onRowEvent)="onRowChange($event)"
  ></app-authority-management-table>
</div>

<app-modal
  [title]="exportModalTitle"
  [isModalOpen]="isExportModalOpen()"
  [modalSize]="'full'"
  [buttons]="modalButtons"
  (isModalClosed)="closeExportModal()"
>
  <div>
    <img [src]="Icons.ARROW_DIRECTION" />
    <span class="text-bold-modal"> A </span>
    <p class="text-modal">
      קוד,סוג,שם גלופה / מכתב,סיווג דוח
      <br />
    </p>
  </div>
</app-modal>

<app-confirmation-modal
  [isModalOpen]="isActiveModalOpen()"
  (onConfirm)="updateIsActive()"
  (isModalClosed)="closeIsActiveModal()"
  [title]="updateTitle"
  [message]="isLetterSelectedIsActive() ? isInActiveText : isActiveText"
></app-confirmation-modal>
