<div
  class="description-tooltip"
  (mouseenter)="show = true"
  (mouseleave)="show = false"
>
  !
</div>
@if (show && (title || description)) {
  <div
    class="step-tooltip"
    [ngClass]="{ last: last }"
  >
    @if (title) {
      <h5 class="title">{{ title }}</h5>
    }
    @if (description) {
      <p class="description">{{ description }}</p>
    }
  </div>
}
