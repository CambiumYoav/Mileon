<div class="container-lg p-4 mt-4">
  <div class="row pb-4 align-items-center position-relative">
    <div class="col d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center col-5">
        <img class="back-icon" [src]="Icons.ARROW_LEFT" />
        <span class="heading">{{ title }}</span>
      </div>
    </div>
    <div class="mt-5">
      <!-- Tabs group component removed - needs to be implemented -->
      <div class="tabs-container">
        @for (tab of tabs; track tab.name) {
          <button 
            class="tab-button"
            [class.active]="currentActive === tab.text"
            (click)="changeTab(tab)"
            [disabled]="tab.disabled"
          >
            {{ tab.text }}
          </button>
        }
      </div>
    </div>
  </div>

  <div class="row">
    <router-outlet></router-outlet>
  </div>
</div>
